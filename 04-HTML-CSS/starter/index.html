<!doctype html>
<!-- 이 문서가 html 문서임을 표시 -->
<html lang="en">
  <!-- html 문서의 언어가 영어임을 표시 -->
  <head>
    <meta charset="UTF-8" />
    <!-- 문자 인코딩 방식이 UTF-8임을 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 반응형 웹 디자인을 위한 뷰포트 설정 -->
    <title>Learning HTML & CSS</title>
    <!-- 웹 페이지의 제목을 설정 -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>JavaScript is fun</h1>
    <p class="first">
      You can learn JavaScript without HTML and CSS, but for DOM manipulation
      it's useful to have some basic ideas of HTML & CSS. You can learn more
      about it on
      <a href="https://github.com/chumingi/complete-javascript-course"
        >My Github repository</a
      >
    </p>

    <h2>Another heading</h2>
    <p class="second">Just another paragraph</p>
    <img src="https://picsum.photos/600/400" alt="Random image" />

    <form id="your-name">
      <h2>Your name here</h2>
      <p class="first">Please fill this form</p>
      <input type="text" placeholder="Your name" />
      <button>OK</button>
    </form>
  </body>
</html>
